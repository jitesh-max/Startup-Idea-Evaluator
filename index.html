<!DOCTYPE html>
<html>
<head>
    <title>Startup Idea Evaluator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Startup Idea Evaluator 🚀</h1>
        <form method="POST">
            <label>Startup Idea:</label>
            <textarea name="startup_idea" required></textarea>

            <label>What Makes It Unique?</label>
            <textarea name="unique" required></textarea>

            <label>Target Market:</label>
            <textarea name="market" required></textarea>

            <label>Competitor Analysis:</label>
            <textarea name="competition" required></textarea>

            <label>Revenue Plan:</label>
            <textarea name="revenue_plan" required></textarea>

            <button type="submit">Evaluate</button>
        </form>

        {% if score is not none %}
            <div class="result">
                <h2>Result: {{ result }}</h2>
                <p>Score: {{ score }}/10</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
